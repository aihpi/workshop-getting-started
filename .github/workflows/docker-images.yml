name: Docker images

# Pull requests: build both images to catch broken Dockerfiles.
# Pushes to main: build and publish to GHCR as
#   ghcr.io/aihpi/aisc-chatbot-backend:latest
#   ghcr.io/aihpi/aisc-chatbot-frontend:latest
# These are the images referenced in docker-compose.yml and
# 03_workshop/guides/08_chatbot_demo.md.

on:
  pull_request:
    paths:
      - "01_frontend/**"
      - "02_backend/**"
      - ".github/workflows/docker-images.yml"
  push:
    branches: [main]
    paths:
      - "01_frontend/**"
      - "02_backend/**"
      - ".github/workflows/docker-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: 02_backend
            dockerfile: 02_backend/Dockerfile
          - name: frontend
            context: 01_frontend
            dockerfile: 01_frontend/Dockerfile.prod
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/aihpi/aisc-chatbot-${{ matrix.name }}:latest
            ghcr.io/aihpi/aisc-chatbot-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
